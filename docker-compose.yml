version: '3.8'

services:
  peerlink-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peerlink-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=peerlink_prod_jwt_secret_998124_prod
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
